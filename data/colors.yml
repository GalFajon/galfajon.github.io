# Monochrome palette: paper-white by default, ink-black in dark mode.
# `accent` is used by the theme for heading links, icon hovers and link
# underlines on hover, so it is the strongest ink available rather than a hue.
default: light
auto_switch: true

light:
  bg: '#ffffff'
  hl_bg: '#f2f2f0'
  fg: '#111111'
  dim_fg: '#5c5c5c'
  stroke: '#d6d6d2'
  accent: '#000000'
  sidebar:
    bg: '#f2f2f0'
    fg: '#111111'

dark:
  bg: '#0e0e0e'
  hl_bg: '#1b1b1b'
  fg: '#ececec'
  dim_fg: '#9a9a9a'
  stroke: '#2f2f2f'
  accent: '#ffffff'
  sidebar:
    bg: '#151515'
    fg: '#ececec'
