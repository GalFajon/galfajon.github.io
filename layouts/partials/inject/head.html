<!-- This code will be injected before closing the head tag -->
{{/* MathJax, loaded only on pages that ask for it with `math = true` in the
     front matter (the lecture-notes section cascades it to every child) */}}
{{ if or .Params.math site.Params.math }}
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{{ end }}

{{/* Tabler Icons webfont, for the bat next to the site title (.ti-bat) */}}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />

<style>
    .batIcon {
        margin-right: 0.45ch;
        font-size: 0.95em;
        vertical-align: -0.05em;
    }
</style>
